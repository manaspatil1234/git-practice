name: My First CI

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name : Checkout Repository
        uses : actions/checkout@v4
    
      - name : Setup Node.js
        uses : actions/setup-node@v4
        with :
          node-version: 22
      - name : Check Node
        run : node --version

      - name : Check npm
        run : npm --version
        
      - name : Install dependencies
        run : npm install

      - name : Run tests
        run : npm test
